bar:
  height: 26
  location: top
  spacing: 6
  margin: 0
  layer: top
  background: 232a2eff
  font: Hack Nerd Font:size=11

  border:
    width: 1
    color: 343f44ff

  left:
    - dwl:
        number-of-tags: 9
        dwl-info-filename: "/tmp/accela-status"
        name-of-tags: [" 1 ", " 2 ", " 3 ", " 4 ", " 5 ", " 6 ", " 7 ", " 8 ", " 9 "]
        content:
          map:
            conditions:
              id == 0:
                string:
                  text: " [{layout}] "
                  foreground: 83c092ff
                  on-click: "accela-msg cyclelayout"
              selected:
                string:
                  text: "{name}"
                  foreground: 232a2eff
                  deco:
                    background:
                      color: a7c080ff
                  on-click: "accela-msg view {id}"
              urgent:
                string:
                  text: "{name}"
                  foreground: 232a2eff
                  deco:
                    background:
                      color: e67e80ff
                  on-click: "accela-msg view {id}"
              ~empty:
                string:
                  text: "{name}"
                  foreground: d3c6aaff
                  deco:
                    background:
                      color: 2d353bff
                  on-click: "accela-msg view {id}"
            default:
              string:
                text: "{name}"
                foreground: 7a8478ff
                on-click: "accela-msg view {id}"

    - foreign-toplevel:
        content:
          map:
            conditions:
              activated:
                string:
                  text: "  {title}  "
                  max: 25
                  foreground: 232a2eff
                  deco:
                    background:
                      color: a7c080ff
              ~activated:
                string:
                  text: "  {title}  "
                  max: 25
                  foreground: d3c6aaff
                  deco:
                    background:
                      color: 2d353bff

  right:
    - network:
        poll-interval: 2000
        content:
          map:
            conditions:
              name == "wlp0s20f3":
                map:
                  conditions:
                    state == "up":
                      string:
                        text: "  "
                        foreground: a7c080ff
                        on-click:
                          left: 'notify-send -u low -t 3000 -i network-wireless "Wi-Fi" "SSID: {ssid}\nQuality: {quality}%\nIP: {ipv4}"'
                          right: 'notify-send -u low -t 3000 -i network-wireless "Wi-Fi" "SSID: {ssid}\nQuality: {quality}%\nIP: {ipv4}"'
                    state == "down":
                      string:
                        text: " 󰤭 "
                        foreground: e67e80ff
                        on-click: 'notify-send -u low -t 3000 "Wi-Fi" "Disconnected"'

    - pipewire:
        content:
          map:
            conditions:
              type == "sink":
                map:
                  conditions:
                    muted:
                      string:
                        text: " 󰝟 MUTED "
                        foreground: e67e80ff
                        on-click:
                          left: "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
                          right: 'notify-send -u low -t 3000 -i audio-speakers "Audio Output" "{description}\nVolume: [Muted]"'
                          wheel-up: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
                          wheel-down: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
                    ~muted:
                      string:
                        text: " 󰕾 {cubic_volume}% "
                        foreground: 7fbbb3ff
                        on-click:
                          left: "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
                          right: 'notify-send -u low -t 3000 -i audio-speakers "Audio Output" "{description}\nVolume: {cubic_volume}%"'
                          wheel-up: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
                          wheel-down: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"

    - script:
        path: /home/hysteria/.local/bin/yambar-bat.sh
        args: []
        content:
          map:
            conditions:
              state == "charging":
                string:
                  text: " 󰂄 {capacity}% (+{watts}) "
                  foreground: a7c080ff
                  on-click: 'notify-send -u low -t 3000 -i battery-charging "Battery" "Charging: {capacity}%\nRate: +{watts}\nFull in: {estimate}"'
              state == "full":
                string:
                  text: " 󰁹 100% "
                  foreground: a7c080ff
                  on-click: 'notify-send -u low -t 3000 -i battery-full "Battery" "Fully charged"'
              state == "discharging" && capacity <= 15:
                string:
                  text: " 󰂃 {capacity}% · {watts} "
                  foreground: e67e80ff
                  on-click: 'notify-send -u critical -t 4000 -i battery-caution "Battery LOW" "Remaining: {estimate}\nRate: {watts}\nLevel: {capacity}%"'
              state == "discharging":
                string:
                  text: " 󰁹 {capacity}% · {watts} "
                  foreground: dbbc7fff
                  on-click: 'notify-send -u low -t 3000 -i battery "Battery" "Remaining: {estimate}\nRate: {watts}\nLevel: {capacity}%"'
            default:
              string:
                text: " 󰁹 {capacity}% · {watts} "
                foreground: dbbc7fff
                on-click: 'notify-send -u low -t 3000 -i battery "Battery" "Status: {state}\nLevel: {capacity}%"'

    - clock:
        time-format: "%H:%M"
        date-format: "%d.%m.%Y"
        content:
          string:
            text: "  {time}  󰃭 {date} "
            foreground: d3c6aaff
